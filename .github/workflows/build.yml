name: Build and push validator image

on:
  push:
    branches:
      - 'deploy-build-*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment from branch name
        run: echo "ENVIRONMENT=${GITHUB_REF_NAME#deploy-build-}" >> "${GITHUB_ENV}"

      - name: Compute image repository
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${owner}/${repo_name}-${ENVIRONMENT}:v0-latest" >> "${GITHUB_ENV}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: validator
          file: validator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
