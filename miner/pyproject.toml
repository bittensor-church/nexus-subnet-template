[project]
name = "miner-reference"
version = "0.1.0"
description = "Reference miner skeleton for the nexus-subnet-template."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.2",
    "httpx",
    "litestar[standard]",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miner_reference"]

[tool.uv]
exclude-newer = "1 week"
